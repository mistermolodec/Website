<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Чат Ассистент</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Шапка в стиле современных приложений */
        header { 
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        header button { 
            background: var(--primary-color); 
            border: none; 
            color: white; 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer; 
            transition: background 0.2s;
        }
        header button:hover { background: var(--primary-hover); }
        
        /* Модальное окно настроек */
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--chat-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-content h2 { margin-bottom: 16px; font-size: 1.2rem; color: var(--text-main); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: var(--primary-color); }
        .save-btn { background: var(--primary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; }

        /* Окно чата */
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .user-message { background: var(--primary-color); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background: var(--chat-bg); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
        .system-message { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; align-self: center; font-size: 0.85rem; border-radius: 8px; text-align: center; }

        /* Форма ввода */
        #input-form { display: flex; padding: 12px 16px; background: rgba(30, 41, 59, 0.8); border-top: 1px solid var(--border-color); gap: 10px; }
        #message-input { flex: 1; padding: 12px 16px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 1rem; outline: none; }
        #message-input:focus { border-color: var(--primary-color); }
        #send-btn { background: var(--primary-color); color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        #send-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Мультивендорный ИИ</h1>
        <button onclick="toggleSettings()">⚙️ Настройки</button>
    </header>

    <!-- Модальное окно настроек -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>Шлюз и параметры</h2>
            <div class="form-group">
                <label>Base URL</label>
                <input type="text" id="base-url" placeholder="https://api.apinex.bond/v1">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="api-key" placeholder="sk-apx...">
            </div>
            <div class="form-group">
                <label>Модель</label>
                <input type="text" id="model-name" placeholder="claude-3-5-sonnet">
            </div>
            <button class="save-btn" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>

    <!-- Область чата -->
    <div id="chat-container">
        <div class="message bot-message">Привет! Всё готово к работе. Нажми «Настройки» вверху, чтобы проверить Base URL и твой ключ APInex, и начни общение.</div>
    </div>

    <!-- Поле ввода -->
    <form id="input-form" onsubmit="sendMessage(event)">
        <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" required>
        <button type="submit" id="send-btn">➤</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("base-url").value = localStorage.getItem("pwa_base_url") || "https://api.apinex.bond/v1";
            document.getElementById("api-key").value = localStorage.getItem("pwa_api_key") || "sk-apx3522a446422cdb74f9e04a2499a426727835c0e5f41eeb5";
            document.getElementById("model-name").value = localStorage.getItem("pwa_model") || "claude-3-5-sonnet";
        });

        function toggleSettings() {
            const modal = document.getElementById("settings-modal");
            modal.style.display = modal.style.display === "flex" ? "none" : "flex";
        }

        function saveSettings() {
            localStorage.setItem("pwa_base_url", document.getElementById("base-url").value.trim());
            localStorage.setItem("pwa_api_key", document.getElementById("api-key").value.trim());
            localStorage.setItem("pwa_model", document.getElementById("model-name").value.trim());
            toggleSettings();
            appendMessage("Система", "Настройки успешно сохранены!", "system-message");
        }

        function appendMessage(sender, text, className) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        let conversationHistory = [];

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;

            const baseUrl = localStorage.getItem("pwa_base_url") || "https://api.apinex.bond/v1";
            const apiKey = localStorage.getItem("pwa_api_key") || "";
            const model = localStorage.getItem("pwa_model") || "claude-3-5-sonnet";

            if (!apiKey) {
                alert("Введите API Key в настройках!");
                return;
            }

            appendMessage("Вы", text, "user-message");
            input.value = "";
            conversationHistory.push({ role: "user", content: text });

            const cleanBaseUrl = baseUrl.replace(/\/+$/, "");
            const endpoint = `${cleanBaseUrl}/chat/completions`;

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: conversationHistory
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    appendMessage("Claude", reply, "bot-message");
                    conversationHistory.push({ role: "assistant", content: reply });
                } else {
                    const errorMsg = data.error ? data.error.message : "Ошибка сервера";
                    appendMessage("Ошибка", `API: ${errorMsg}`, "system-message");
                }
            } else (err) { // исправление синтаксиса catch
                // На всякий случай обрабатываем сетевые ошибки
            } catch (err) {
                appendMessage("Ошибка", `Сетевая ошибка: ${err.message}`, "system-message");
            }
        }
    </script>
</body>
</html>
